<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國語數位基地 - 生字英雄傳</title>
    <!-- 引入動畫庫，讓網頁打開時有帥氣的登場效果 -->
    <link rel="stylesheet" href="https://cloudflare.com"/>
    <style>
        /* 基礎遊戲大廳風格 */
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            /* 神秘的魔幻暗色漸層背景 */
            background: linear-gradient(135deg, #1a1c29 0%, #0e1017 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #fff;
        }

        /* 遊戲主面板容器 */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            border-radius: 20px;
            /* 讓面板邊框微微發光 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            max-width: 800px;
            width: 100%;
        }

        /* 標題：生字英雄傳 */
        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #ffd700; /* 皇家金色 */
            /* 金色文字發光特效 */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5),
                         0 0 20px rgba(255, 215, 0, 0.2);
        }

        /* 任務卡牌群組 */
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap; /* RWD 自動換行 */
        }

        /* 基礎遊戲任務卡牌樣式 */
        .btn {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* 增加圖示間距與大小 */
        .btn::before {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
        }

        /* 戰力懸停特效：浮起、發光、放大 */
        .btn:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ⚔️ 關卡一：魔王討伐戰 (熾烈紅) */
        .btn-red {
            background: linear-gradient(135deg, #bdc3c7, #2c3e50); /* 預備暗底 */
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        }
        .btn-red:hover {
            box-shadow: 0 0 25px rgba(255, 75, 43, 0.6);
        }
        .btn-red::before { content: "⚔️"; }

        /* 📜 關卡二：公會懸賞任務 (翡翠綠) */
        .btn-green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .btn-green:hover {
            box-shadow: 0 0 25px rgba(56, 239, 125, 0.6);
        }
        .btn-green::before { content: "📜"; }

        /* 🏰 關卡三：陣營領地戰 (神秘紫) */
        .btn-purple {
            background: linear-gradient(135deg, #8a2387 0%, #e94057 50%, #f27121 100%);
        }
        .btn-purple:hover {
            box-shadow: 0 0 25px rgba(138, 35, 135, 0.6);
        }
        .btn-purple::before { content: "🏰"; }

    </style>
</head>
<body>

    <!-- container 加上登場動畫，讓進入基地時很有儀式感 -->
    <div class="container animate__animated animate__fadeInUp">
        <h1>Welcome to 國語數位基地<br>✨ 生字英雄傳 ✨</h1>
        
        <div class="btn-group">
            <!-- 各自對應 page1, page2, page3 資料夾 -->
            <a href="./page1/" class="btn btn-red">魔王討伐戰</a>
            <a href="./page2/" class="btn btn-green">公會懸賞任務</a>
            <a href="./page3/" class="btn btn-purple">陣營領地戰</a>
        </div>
    </div>

</body>
</html>
